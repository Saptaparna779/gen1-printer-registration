name: QA Prep on Ready for QA

on:
  repository_dispatch:
    types: [qa_ready]

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch live Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira_ticket.py ${{ github.event.client_payload.issue_key }}

      - name: Generate diff against the fix branch
        run: |
          mkdir -p reports
          git fetch origin ${{ github.event.client_payload.branch }}
          FIX_COMMIT=$(git rev-parse origin/${{ github.event.client_payload.branch }})
          git diff ${FIX_COMMIT}^ ${FIX_COMMIT} -- app/ > reports/${{ github.event.client_payload.issue_key }}_diff.txt

      - name: Generate the Copilot validation prompt
        run: |
          cat > reports/${{ github.event.client_payload.issue_key }}_copilot_prompt.txt << 'EOF'
          You are acting as a Fix Validation Agent for a QA workflow.

          Using:
          - The live ticket details in ${{ github.event.client_payload.issue_key }}_live.md
          - The code diff in ${{ github.event.client_payload.issue_key }}_diff.txt
          - The business rules in business_rules.md
          - The scoring rubric in confidence_rubric.md

          Do the following:
          1. Check whether the diff satisfies EVERY acceptance criterion listed in
             the ticket. Go through them one by one.
          2. Assess whether the fix addresses the root cause described in the
             business rules, or only the specific symptom in the "Steps to
             Reproduce" section.
          3. Note any obvious regression risk introduced by this diff.
          4. Apply the confidence rubric and give a single numeric score (0-100)
             with a one-line justification for that score.
          5. Write your full findings to a new file: reports/${{ github.event.client_payload.issue_key }}_validation_report.md
             Format it as:

             # Validation Report: ${{ github.event.client_payload.issue_key }}
             ## Acceptance Criteria Check
             (one line per criterion: met / not met / partially met, with reasoning)
             ## Root Cause Assessment
             (your analysis)
             ## Regression Risk
             (your analysis)
             ## Confidence Score
             Score: X/100
             Justification: ...

          Do not modify any other files.
          EOF

      - name: Commit fetched ticket + diff back to the repo
        run: |
          git config user.name "qa-automation-bot"
          git config user.email "qa-automation-bot@users.noreply.github.com"
          git add -f jira_context reports
          git commit -m "Auto-prep QA context for ${{ github.event.client_payload.issue_key }}" || echo "Nothing new to commit"
          git push

      - name: Notify Jira that prep is ready for Copilot review
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          echo "QA prep is ready. Pull the latest changes, open VS Code, and run the Copilot Agent validation for this ticket (see reports/${{ github.event.client_payload.issue_key }}_diff.txt and jira_context/${{ github.event.client_payload.issue_key }}_live.md)." > reports/notify.md
          python post_jira_comment.py ${{ github.event.client_payload.issue_key }} reports/notify.mds