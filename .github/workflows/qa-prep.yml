name: QA Prep on Ready for QA

on:
  repository_dispatch:
    types: [qa_ready]

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch live Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira_ticket.py ${{ github.event.client_payload.issue_key }}

      - name: Generate diff by searching commit history for the issue key
        run: |
          mkdir -p reports
          FIX_COMMIT=$(git log origin/main --grep="${{ github.event.client_payload.issue_key }}" --format="%H|%an" | grep -v "qa-automation-bot" | head -1 | cut -d'|' -f1)
          if [ -z "$FIX_COMMIT" ]; then
            echo "No commit found on main mentioning ${{ github.event.client_payload.issue_key }} (excluding bot commits)" > reports/${{ github.event.client_payload.issue_key }}_diff.txt
          else
            git diff ${FIX_COMMIT}^ ${FIX_COMMIT} -- app/ tests/ > reports/${{ github.event.client_payload.issue_key }}_diff.txt
          fi

      - name: Generate the Copilot validation prompt
        run: |
          sed 's/{{ISSUE_KEY}}/${{ github.event.client_payload.issue_key }}/g' docs/validation_prompt_template.md > reports/${{ github.event.client_payload.issue_key }}_copilot_prompt.txt

      - name: Generate the test generation prompt
        run: |
          sed 's/{{ISSUE_KEY}}/${{ github.event.client_payload.issue_key }}/g' docs/test_generation_prompt_template.md > reports/${{ github.event.client_payload.issue_key }}_test_generation_prompt.txt

      - name: Commit fetched ticket + diff back to the repo
        run: |
          git config user.name "qa-automation-bot"
          git config user.email "bpatel@example.org"
          git add -f jira_context reports
          git commit -m "Auto-prep QA context for ${{ github.event.client_payload.issue_key }}" || echo "Nothing new to commit"
          git push

      - name: Notify Jira that prep is ready for Copilot review
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          echo "QA prep is ready. Pull the latest changes, open VS Code, and run the Copilot Agent validation for this ticket (see reports/${{ github.event.client_payload.issue_key }}_diff.txt and jira_context/${{ github.event.client_payload.issue_key }}_live.md)." > reports/notify.md
          python post_jira_comment.py ${{ github.event.client_payload.issue_key }} reports/notify.md

      - name: Install AAVA trigger dependencies
        run: pip install requests

      - name: Trigger AAVA QA Pipeline
        env:
          AAVA_API_TOKEN: ${{ secrets.AAVA_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          JIRA_PAT: ${{ secrets.JIRA_API_TOKEN }}
        run: python trigger_aava_workflow.py ${{ github.event.client_payload.issue_key }}